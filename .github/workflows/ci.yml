name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib
      - name: Verify npm package contents
        run: npm pack --dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:compat:browser
